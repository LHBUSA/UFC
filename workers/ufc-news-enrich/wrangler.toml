name = "ufc-news-enrich"
main = "src/index.js"
compatibility_date = "2026-09-09"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

# Required. This Worker imports scripts/news/lib.mjs for the fighter index and
# the alias resolver, which use node:crypto and touch node:fs inside a
# try/catch. Entity resolution must use the SAME resolver ufc-news-ingest and
# the CLI use, or "who is this story about" gets three different answers.
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"
UFC_EDITORIAL_OPENAI_MODEL = "gpt-5.6-sol"
# Scoring wants a cheaper model than the writer, and the obvious name for one
# ("...-mini") returned 404: it does not exist on this account. Rather than
# guess again, scoring runs on the model we KNOW is available -- the same one
# ufc-newsroom has used in production since 2026-09-08. Cost per score is a
# short structured call on a headline, and a wrong model name costs every
# article, so the trade is not close.
UFC_RELEVANCE_MODEL = "gpt-5.6-sol"

# PUBLICATION IS ON, FOR THE GREEN PATH ONLY.
#
# This flag is ONE of the conditions in greenPath(), not the decision. An
# article publishes itself only when every one of these holds: relevance >= 3
# from a scorer that was actually working, a resolved primary fighter above the
# confidence threshold, a source we FETCHED with a usable body, a built packet,
# a completed GPT-5.6 Sol call, deterministic validators passing first time,
# provenance-safe numbers, dedupe clear, a correctly credited hero or an honest
# absence, and a source published within 24 hours.
#
# Anything else is status='review' with the blockers recorded verbatim. A 403 or
# a thin source is a review article, always: an accurate piece written from our
# own tables alone still rests on a news peg we did not verify, and that
# condition is the one most likely to be quietly relaxed to raise volume.
#
# The 24-hour rule exists because the 217-item backlog was ingested in one burst
# from a 14-day window and every row in it looks freshly DETECTED. Going live
# must not mean dumping a fortnight of archive onto the front page.
PUBLISH_ENABLED = "true"

# CPU. The editorial call is the long pole: GPT-5.6 Sol at medium reasoning over
# a full intelligence packet routinely runs 30-60s of wall clock, and a
# corrective retry doubles it. Wall time is not CPU time, but the packet build
# and the validators are real work and the default 30s is not enough headroom.
[limits]
cpu_ms = 120000

# The fast path: ufc-news-ingest produces, this consumes. Detection to article
# is then bounded by the model call rather than by a polling interval.
# Worker-to-Worker, via a SERVICE BINDING rather than an HTTP fetch.
#
# The first version called https://ufc-video-autopilot.sales-fd3.workers.dev
# directly and got a 404 for every article. Both Workers live on the same
# workers.dev subdomain, so the request looped back into the CALLING Worker,
# hit its own router, found no /resolve route and returned its own not_found.
# Nothing errored; video was simply never attached, and the reason string said
# "resolver http 404" as though the other Worker had answered.
#
# A service binding routes in-process, skips DNS and TLS entirely, and cannot
# be intercepted by the caller's own routes.
[[services]]
binding = "VIDEO"
service = "ufc-video-autopilot"

[[queues.consumers]]
queue = "ufc-news-candidates"
max_batch_size = 3
max_batch_timeout = 5
max_retries = 2
dead_letter_queue = "ufc-news-candidates-dlq"

# The claim loop. Not a backup for the queue - it is how the backlog drains and
# how an item whose consumer died gets its lease reclaimed.
[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# Secrets (wrangler secret put, for the ufc-news-enrich Worker):
#   SUPABASE_SERVICE_ROLE_KEY  required
#   OPENAI_API_KEY             required; GPT-5.6 Sol writes, sol-mini scores
#   ADMIN_TRIGGER_TOKEN        required to expose any POST route at all
