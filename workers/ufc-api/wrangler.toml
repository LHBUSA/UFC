name = "propbetedge-ufc-api"
main = "src/index.js"
compatibility_date = "2026-09-05"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "ufc-api.propbetedge.ai"
custom_domain = true

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"
API_VERSION = "2026-09-12.1"
REQUIRE_API_KEY = "false"
# Durable first-party media origin: public Supabase Storage bucket `ufc-media`.
# ufc_images.r2_key ("fighters/<id>/portrait.jpg") resolves to {base}/{r2_key};
# card.jpg / thumb.jpg derivatives sit beside it; rankings/latest.json lives here too.
UFC_IMAGE_BASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co/storage/v1/object/public/ufc-media"

# Required secret before deploy:
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# Optional when REQUIRE_API_KEY=true:
#   npx wrangler secret put INTERNAL_API_KEY
#
# Optional KV binding for customer API keys. Store records at key:<sha256(api-key)>.
# [[kv_namespaces]]
# binding = "API_KEYS"
# id = "<namespace-id>"
