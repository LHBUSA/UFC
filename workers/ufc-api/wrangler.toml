name = "propbetedge-ufc-api"
main = "src/index.js"
compatibility_date = "2026-09-05"
workers_dev = true

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"
API_VERSION = "2026-09-06"
REQUIRE_API_KEY = "false"

# Required secret before deploy:
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
