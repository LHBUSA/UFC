name = "ufc-algo"
main = "src/index.js"
compatibility_date = "2026-09-14"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"
# dry_run: read, score, report; write only a ufc_model_runs row.
# armed:   evaluations, drafts, database-clock locks and grades. Flip ONLY after
#          owner approval AND a registered live model version.
ALGO_MODE = "dry_run"

# Hourly at :41. The lock pass opens at event_date 00:00 UTC - 8h (16:00 UTC the
# day before) and the database refuses locks from - 6h, so every card gets two
# scheduled lock attempts (16:41 and 17:41 UTC) after official weigh-ins.
[triggers]
crons = ["41 * * * *"]

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true

# Secrets (wrangler secret put), never in this file:
#   SUPABASE_SERVICE_ROLE_KEY
#   ADMIN_TRIGGER_TOKEN
