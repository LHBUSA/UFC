name = "ufc-stats-ingest"
main = "src/index.js"
compatibility_date = "2026-08-29"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"
UFCSTATS_BASE = "http://ufcstats.com"
# How many NEW completed events one invocation may process. The rest wait for
# the next run. Keeps a single run well inside the subrequest limit
# (~1 list + 1 event + ~13 fight pages + ~26 fighter pages + writes per event).
MAX_EVENTS_PER_RUN = "3"
# "false" = ESPN-first path only (no ufcstats.com contact).
# OFF, and still blocked on source access (not on code):
#   2026-09-10 16:57Z  canary from Cloudflare (DTW): challenge interstitial.
#   2026-09-13 23:20Z  canary n=6 from Cloudflare (ORD, v6): challenge
#                      interstitial on the first fight page; verdict
#                      "challenged"; 0 bouts compared; solver not used.
#   2026-09-14 00:34Z  canary n=6 from Cloudflare (ORD, v6): same interstitial,
#                      same verdict; retry_after 06:34Z.
# It is turned on only after POST /admin/canary returns verdict "clean" from
# Cloudflare egress (no challenge, parser reproduces stored round rows column
# for column, identity validation passes). Do not flip it to get past a
# challenge, and do not enable UFCSTATS_SOLVE_CHALLENGE without an explicit
# operator decision.
# While it is off, completed cards collect results but no round rows. That is
# no longer silent: every run and the hourly fast-cron check report
# round_lane_status "degraded" with a ROUND ARCHIVE GAP per affected card
# (/health, run notes, one Discord alert, deduped and escalated every 24h).
UFCSTATS_ENABLED = "false"
# Owner decision 2026-09-14 (after the single-bout canary at 10:00Z was challenged
# on its first and only request): UFC Stats is a BLOCKED fallback. Do not schedule
# canaries when retry_after expires, do not sweep, do not build or enable challenge
# solving. Round data comes from the official UFC statistics feed, including the
# Contender Series ("DWCS <season>.<week>" official events). Reported on /health.
UFCSTATS_SOURCE_STATUS = "blocked"
# Hours after the end of the event day (UTC) before a completed card with
# missing round rows counts as a round-archive gap.
ROUND_ARCHIVE_GRACE_HOURS = "12"
# While a gap persists, re-alert at most this often.
ROUND_ARCHIVE_ESCALATE_HOURS = "24"
# Forward maintenance only. Without this the completed-events walk marches
# backwards through the archive three events at a time and competes with the
# detached Wayback backfill over the same rows. History belongs to that queue;
# this worker only stops newly completed events from creating new gaps.
UFCSTATS_FORWARD_DAYS = "45"
# Per-run ceiling on UFC Stats fight pages. The lane is bout-driven, so a quiet
# run fetches nothing; this bounds the worst case (a full card whose stats all
# post between two runs) to one polite burst at 1 request/second.
MAX_UFCSTATS_FIGHTS_PER_RUN = "24"
# Hard ceiling on UFC Stats requests of any kind per run (event pages, fighter
# histories, fight pages). Identity resolution stops for the run at this cap.
MAX_UFCSTATS_REQUESTS_PER_RUN = "60"
# After a challenge the fetch layer will not answer, stay off UFC Stats this
# long. ESPN keeps running. Degrade, never hammer.
SOURCE_BACKOFF_HOURS = "6"
# A UFC Stats challenge is NOT answered. The pass aborts, the source is
# recorded as challenged (source, timestamp, retry_after) and the lane stays
# off it for SOURCE_BACKOFF_HOURS. "true" re-enables the proof-of-work solver
# in ufcstats.mjs for the exact 2026-09-05 shape; that is an operator decision.
UFCSTATS_SOLVE_CHALLENGE = "false"
# Official UFC statistics feed (src/ufcOfficial.mjs): per-round statistics from
# the JSON behind UFC.com event pages. Used ONLY while UFC Stats cannot be read
# (disabled or challenged); writes round rows and queue state, never results,
# bouts, events or UFC Stats ids. Equivalence before enabling: 23 bouts whose
# UFC Stats rows were stored, 2,156 cells compared, 0 mismatches
# (docs/ops/evidence/ufc_official_round_feed_equivalence_2026-09-14.json).
# Turned on only after POST /admin/official-canary is clean from Cloudflare egress:
#   2026-09-14  v0.7.0 (9aeedd44), official events 1327 + 1326: verdict "clean",
#               25 bouts, 2,244 cells, 0 mismatches, 0 validation problems
#               (docs/ops/evidence/ufc_official_canary_2026-09-14.json). Owner approved.
UFC_OFFICIAL_ROUNDS_ENABLED = "true"
# Per-run ceiling on official feed requests (UFC.com event page + event + fight documents).
MAX_OFFICIAL_REQUESTS_PER_RUN = "45"
OFFICIAL_MIN_INTERVAL_MS = "1000"
# Optional window override for ESPN, e.g. "20251214" or "20251201-20251231".
# ESPN_DATES = ""

# Cadence. Matches what is deployed (daily 06:00 UTC) until the canary passes;
# see UFCSTATS_ENABLED above. Cloudflare owns scheduling; GitHub is source only.
[triggers]
# Two crons, two jobs — see the `scheduled` handler in src/index.js.
#
#   0 6 * * *     daily maintenance. Unchanged: full ESPN window walk, archive
#                 passes, queue maintenance.
#   * * * * *     FIGHT NIGHT. ESPN marks a bout final within seconds; without
#                 this the database did not learn it until the next morning.
#                 The handler resolves the active card from stored broadcast
#                 times (ufc_event_broadcasts, falling back to ufc_events) and
#                 returns immediately when none is inside the window — one
#                 indexed query, no ESPN request, no run row. When a card IS
#                 live it refreshes ONLY that card, from its own single-day
#                 ESPN window, with the same identity validation and idempotent
#                 writes as the daily pass. It runs no archive maintenance.
crons = ["0 6 * * *", "* * * * *"]

# Fight DNA owner. After new round rows land, ask ufc-intelligence to run its
# fingerprint-gated build instead of waiting for the 07:17 UTC one. RPC over a
# service binding: not reachable from the internet, no shared token.
[[services]]
binding = "INTELLIGENCE"
service = "ufc-intelligence"
entrypoint = "DnaTrigger"


# Live PBE receipt grading. After a fight-night result pass, trigger a
# grade-only refresh in ufc-algo; this does not score, regenerate or lock picks.
[[services]]
binding = "ALGO_GRADER"
service = "ufc-algo"
entrypoint = "GradeRefresh"

# Raw HTML archive: ufc-raw/{events|fights|fighters}/{id}.html on first fetch.
# Create the bucket first: wrangler r2 bucket create ufc-raw
[[r2_buckets]]
binding = "RAW"
bucket_name = "ufc-raw"

# Secrets (wrangler secret put):
#   SUPABASE_SERVICE_ROLE_KEY  - database access
#   DISCORD_WEBHOOK_URL        - alerts. Optional, but without it a ROUND ARCHIVE GAP is
#                                only visible on /health and in run notes (recorded as
#                                delivered "discord_unconfigured"). Unset in production
#                                as of 2026-09-13.
#   ADMIN_TRIGGER_TOKEN        - unlocks POST /admin/run and POST /admin/canary (404 if unset)

# Retained logs. Without this there is no record that a cron ever fired.
[observability]
enabled = true
head_sampling_rate = 1
