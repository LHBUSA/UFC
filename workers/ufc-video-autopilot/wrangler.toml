name = "ufc-video-autopilot"
main = "src/index.js"
compatibility_date = "2026-09-10"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

# scripts/videos/*.mjs import the shared alias resolver and the news lib for
# entity linking. Reused unchanged — this is a change of execution ownership.
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"

# Discovery walks every verified channel and may check embeddability per video.
[limits]
cpu_ms = 120000

# Replaces video-autopilot.yml's "17,47 * * * *", offset by four minutes so the
# two never run against each other during the changeover.
[triggers]
crons = ["13,43 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1

# Secrets:
#   SUPABASE_SERVICE_ROLE_KEY  required
#   ADMIN_TRIGGER_TOKEN        required to expose POST /admin/run at all
#   YOUTUBE_API_KEY            optional; without it discovery falls back to the
#                              public Atom feed + oEmbed and duration_sec stays
#                              null. The fallback is a real path, not a stub.
