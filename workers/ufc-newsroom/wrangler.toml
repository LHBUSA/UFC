name = "ufc-newsroom"
main = "src/index.js"
compatibility_date = "2026-09-08"
account_id = "fd3a233edadd0a60916413c1199f71ee"
workers_dev = true

# The newsroom imports scripts/news/*.mjs unchanged so the Worker runs the same
# editorial code as the CLI. Those modules use node:crypto for the fact-block
# hash and node:fs inside a try/catch for .env, so Node compatibility is a hard
# requirement, not a convenience. The hash in particular must stay byte-identical
# to the CLI's: a different digest would change every article's fact-block hash
# at once and trigger a full, meaningless refresh of the archive.
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://tkmlnhmylqnttmnsnief.supabase.co"

# Cadence. Three triggers, and the coordinator may add overdue phases to any of
# them — see src/coordinator.mjs.
#
# This is the part that replaces GitHub Actions, so it is worth being precise
# about what changed. The workflow selected jobs by matching the exact cron
# string, and GitHub's scheduler is best effort: on this repository the
# every-30-minutes cron was observed firing at 1 to 5 hour gaps, and the daily
# 09:05 slot ran at 13:29. A late run still carried its own cron string, so it
# ran its own job and skipped the others; a dropped slot was never made up by
# anything. Cloudflare's scheduler is considerably more reliable, but the fix
# here does not rest on that: every phase also carries a maximum age checked
# against the run ledger, so a missed slot is picked up by whichever trigger
# fires next. Cadence is a floor on freshness rather than a hope about timers.
[triggers]
crons = [
  "*/30 * * * *",   # source and news ingest; writer follows a meaningful ingest
  "15 */2 * * *",   # two-hourly baseline article refresh
  "20 10 * * *",    # daily editorial quality sweep
]

# Retained logs. Without this there is no record that a cron ever fired, which
# is half of how the previous scheduler failed unnoticed.
[observability]
enabled = true
head_sampling_rate = 1

# Secrets (wrangler secret put --name ufc-newsroom):
#   SUPABASE_SERVICE_ROLE_KEY  required; database access
#   ADMIN_TRIGGER_TOKEN        required to expose POST /admin/run at all (404 without it)
#   ANTHROPIC_API_KEY          optional; enables editorial enhancement only
#   DISCORD_WEBHOOK_URL        optional; alerts
#
# No GitHub Copilot CLI, no GITHUB_TOKEN, and no npm install at run time.
#
# Run logging reuses public.ufc_ingest_runs with worker='ufc-newsroom'. That
# table already carries a worker discriminator, a status enum including
# 'partial', and a notes jsonb, so NO migration is required for this Worker.
