name: UFC curated portrait sync

on:
  push:
    branches:
      - ufc-fight-dna-v1
    paths:
      - 'scripts/images/commons_overrides.json'
      - 'scripts/images/fetch_fighter_portraits.mjs'
      - '.github/workflows/curated-portrait-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ufc-curated-portrait-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --prefix web --ignore-scripts=false

      - name: Syntax and curated-map validation
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/images/fetch_fighter_portraits.mjs
          node -e 'const x=require("./scripts/images/commons_overrides.json"); if(!x || Array.isArray(x) || !Object.keys(x).length) process.exit(2); for(const [id,v] of Object.entries(x)){if(!/^[0-9a-f-]{36}$/i.test(id)||!v.name||!v.file) throw new Error(`bad override ${id}`)} console.log(`validated ${Object.keys(x).length} curated override(s)`)'

      - name: Build vetted fighter list
        id: fighters
        shell: bash
        run: |
          node - <<'NODE' > curated-ids.txt
          const x=require('./scripts/images/commons_overrides.json');
          for(const id of Object.keys(x).sort()) console.log(id);
          NODE
          echo "count=$(wc -l < curated-ids.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cat curated-ids.txt

      - name: Dry-run every vetted fighter
        shell: bash
        run: |
          set -euo pipefail
          : > curated-dry-run.log
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            tmp="$(mktemp)"
            node scripts/images/fetch_fighter_portraits.mjs --dry-run --force --fighter "$id" | tee "$tmp" | tee -a curated-dry-run.log
            if ! grep -Eq "[[:space:]]${id}[[:space:]].*[[:space:]]ok[[:space:]]" "$tmp"; then
              echo "Dry-run did not resolve ${id} to an accepted portrait" >&2
              rm -f "$tmp"
              exit 1
            fi
            rm -f "$tmp"
          done < curated-ids.txt

      - name: Upload every vetted portrait
        shell: bash
        run: |
          set -euo pipefail
          : > curated-sync.log
          while IFS= read -r id; do
            [ -n "$id" ] || continue
            node scripts/images/fetch_fighter_portraits.mjs --force --fighter "$id" | tee -a curated-sync.log
          done < curated-ids.txt

      - name: Coverage proof
        shell: bash
        run: |
          node - <<'NODE' | tee curated-coverage.log
          const base=(process.env.SUPABASE_URL||'').replace(/\/$/,'');
          const key=process.env.SUPABASE_SERVICE_ROLE_KEY;
          const h={apikey:key,Authorization:`Bearer ${key}`};
          const get=async p=>{const r=await fetch(`${base}/rest/v1/${p}`,{headers:h});if(!r.ok)throw new Error(`${r.status} ${await r.text()}`);return r.json()};
          const today=new Date().toISOString().slice(0,10);
          const [bouts,images]=await Promise.all([
            get(`ufc_bouts?select=fighter_a_id,fighter_b_id,ufc_events!inner(event_date)&ufc_events.event_date=gte.${today}&status=neq.cancelled&limit=5000`),
            get('ufc_images?select=fighter_id&fighter_id=not.is.null&limit=5000'),
          ]);
          const booked=new Set(bouts.flatMap(b=>[b.fighter_a_id,b.fighter_b_id]));
          const pictured=new Set(images.map(i=>i.fighter_id));
          const covered=[...booked].filter(id=>pictured.has(id)).length;
          console.log(`total_images=${images.length}`);
          console.log(`upcoming_unique=${booked.size}`);
          console.log(`upcoming_with_image=${covered}`);
          console.log(`upcoming_missing=${booked.size-covered}`);
          console.log(`coverage_pct=${booked.size?(100*covered/booked.size).toFixed(1):'0.0'}`);
          NODE

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufc-curated-portrait-sync-${{ github.run_id }}
          path: |
            curated-ids.txt
            curated-dry-run.log
            curated-sync.log
            curated-coverage.log
          if-no-files-found: warn
          retention-days: 14
