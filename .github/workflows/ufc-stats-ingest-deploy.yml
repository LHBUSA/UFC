name: Deploy UFC stats ingest

on:
  push:
    branches: [ufc-fight-dna-v1]
    paths:
      - ".github/workflows/ufc-stats-ingest-deploy.yml"
      - "workers/ufc-stats-ingest/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ufc-stats-ingest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/ufc-stats-ingest/package-lock.json
      - name: Require Cloudflare deployment credential
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install worker dependencies
        working-directory: workers/ufc-stats-ingest
        run: npm ci
      - name: Worker tests
        working-directory: workers/ufc-stats-ingest
        run: npm test
      - name: Deploy production ingest worker
        working-directory: workers/ufc-stats-ingest
        run: npx wrangler deploy
