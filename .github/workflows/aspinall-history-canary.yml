name: Aspinall history canary

on:
  push:
    branches: [ufc-fight-dna-v1]
    paths:
      - ".github/workflows/aspinall-history-canary.yml"

permissions:
  contents: read

concurrency:
  group: aspinall-history-canary
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      UFCSTATS_BASE: http://ufcstats.com
      UFCSTATS_USER_AGENT: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/128 Safari/537.36
      WAYBACK_MIN_INTERVAL_SEC: "1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/backfill/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r scripts/backfill/requirements.txt
      - name: Syntax gate
        run: |
          python -m py_compile scripts/backfill/backfill_missing_events.py
          node --check scripts/dna/build_fight_dna.mjs
      - name: Repair Aspinall history only
        run: |
          python scripts/backfill/backfill_missing_events.py \
            --source wayback \
            --target-fighter 399afbabc02376b5 \
            --event-id 026b4f7049085842 \
            --event-id 5a558ba1ff5e9121 \
            --event-id 1174782eacde9b0c \
            --event-id 319c15b8aac5bfde \
            --event-id 1d00756835ca67c9 \
            --event-id b9532d815060de7f \
            --event-id bfe95ec546692b13 \
            --event-id fd4578cac86d75ca \
            --event-id dde70a112e053a6c \
            --verify-fighter 399afbabc02376b5 \
            --expected-bouts 10
      - name: Rebuild Aspinall Fight DNA
        run: node scripts/dna/build_fight_dna.mjs --fighter 37851d60-2afd-426c-970e-e32abe06e09d
      - name: Coverage proof
        run: |
          python - <<'PY'
          import os, requests
          base=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1'
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          h={'apikey':key,'Authorization':f'Bearer {key}'}
          f=requests.get(base+'/ufc_fighters',headers=h,params={'select':'id,fight_history_count','ufcstats_id':'eq.399afbabc02376b5'},timeout=30).json()[0]
          bouts=requests.get(base+'/ufc_bouts',headers=h,params={'select':'id,ufcstats_id','or':f"(fighter_a_id.eq.{f['id']},fighter_b_id.eq.{f['id']})"},timeout=30).json()
          ids=[b['id'] for b in bouts]
          results=[]; rounds=[]
          if ids:
              group='('+','.join(ids)+')'
              results=requests.get(base+'/ufc_bout_results',headers=h,params={'select':'bout_id,has_stats','bout_id':f'in.{group}'},timeout=30).json()
              rounds=requests.get(base+'/ufc_bout_round_stats',headers=h,params={'select':'bout_id,round','fighter_id':f"eq.{f['id']}"},timeout=30).json()
          proof={'expected_history':f.get('fight_history_count'),'bouts':len(bouts),'results':len(results),'stat_bouts':len({r['bout_id'] for r in rounds}),'round_rows':len(rounds)}
          print(proof)
          if len(bouts)<10 or len(results)<10:
              raise SystemExit(f"coverage proof failed: {proof}")
          PY
