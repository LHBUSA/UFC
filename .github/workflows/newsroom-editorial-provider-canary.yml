name: newsroom editorial provider canary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/newsroom-editorial-provider-canary.yml"

permissions:
  contents: read
  copilot-requests: write

jobs:
  copilot-cli-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ufc-fight-dna-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Copilot CLI inference probe
        run: |
          copilot -p 'Return exactly this JSON object and nothing else: {"provider":"copilot","ok":true}' -s --model gpt-5.5 --no-ask-user --no-custom-instructions > copilot.out
          cat copilot.out
          grep -q '"ok"[[:space:]]*:[[:space:]]*true' copilot.out
