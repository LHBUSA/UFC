name: newsroom editorial provider canary

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/newsroom-editorial-provider-canary.yml"

permissions:
  contents: read
  copilot-requests: write

concurrency:
  group: newsroom-editorial-provider-canary
  cancel-in-progress: true

jobs:
  copilot-cli-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ufc-fight-dna-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Copilot CLI inference probe
        run: |
          timeout 90s copilot \
            -p 'Return exactly this JSON object and nothing else: {"provider":"copilot","ok":true}' \
            -s \
            --model auto \
            --stream=off \
            --no-color \
            --no-ask-user \
            --no-custom-instructions \
            --no-remote \
            > copilot.out
          cat copilot.out
          grep -q '"ok"[[:space:]]*:[[:space:]]*true' copilot.out
