name: DWCS historical backfill

on:
  push:
    branches: [ufc-fight-dna-v1]
    paths:
      - ".github/workflows/dwcs-historical-backfill.yml"
      - "scripts/backfill/run_dwcs_espn_backfill.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dwcs-historical-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Season year ${{ matrix.year }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workers/ufc-stats-ingest/package-lock.json
      - name: Require production database credentials
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install ingest dependencies
        working-directory: workers/ufc-stats-ingest
        run: npm ci --omit=dev
      - name: Syntax gate
        run: node --check scripts/backfill/run_dwcs_espn_backfill.mjs
      - name: Backfill DWCS season year
        run: node scripts/backfill/run_dwcs_espn_backfill.mjs --year "${{ matrix.year }}"
