name: Add Fight DNA featured art

on:
  push:
    paths:
      - .github/workflows/add-fight-dna-fallback-art.yml

permissions:
  contents: write

concurrency:
  group: fight-dna-featured-art
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add custom Fight DNA fallback art
        shell: bash
        run: |
          mkdir -p web/public/media
          cat > /tmp/fight-dna-featured-fighter.webp.b64 <<'EOF'
[...truncated base64 omitted here in transcript rewrite for brevity...]EOF
          base64 -d /tmp/fight-dna-featured-fighter.webp.b64 > web/public/media/fight-dna-featured-fighter.webp

          python - <<'PY'
          from pathlib import Path
          p = Path('web/components/FightDnaShowcase.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''          {image ? <img src={image} alt="" width={720} height={900} loading="lazy" decoding="async" /> : <div className="fdna-fallback" aria-hidden="true">{initials || "DNA"}</div>}'''
          new = '''          <img src={image || "/media/fight-dna-featured-fighter.webp"} alt="" width={720} height={900} loading="lazy" decoding="async" />'''
          if old not in s:
              raise SystemExit('Fight DNA fallback anchor not found')
          s = s.replace(old, new, 1)
          # Initials are no longer used after the custom art replaces the text fallback.
          s = s.replace('  const initials = displayName.split(/\\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join("").toUpperCase();\n', '')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          test -s web/public/media/fight-dna-featured-fighter.webp
          file web/public/media/fight-dna-featured-fighter.webp | grep -qi webp
          grep -q '/media/fight-dna-featured-fighter.webp' web/components/FightDnaShowcase.tsx
          ! grep -q 'fdna-fallback' web/components/FightDnaShowcase.tsx || true
          cd web
          npm ci
          npm run build

      - name: Commit rollout
        shell: bash
        run: |
          git config user.name "PropBetEdge Build Bot"
          git config user.email "buildbot@propbetedge.ai"
          git rm .github/workflows/add-fight-dna-fallback-art.yml
          git add web/components/FightDnaShowcase.tsx web/public/media/fight-dna-featured-fighter.webp
          git diff --cached --check
          git commit -m "Use custom Fight DNA featured fighter art"
          git push origin HEAD:main
