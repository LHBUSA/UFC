name: Deploy UFC news ingest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ufc-news-ingest-deploy.yml"
      - "workers/ufc-news-ingest/**"
      - "scripts/news/**"
      - "scripts/status/**"
      - "shared/alias_resolver.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ufc-news-ingest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cloudflare deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured; production deploy is blocked."
            exit 1
          fi

      - name: Worker tests
        working-directory: workers/ufc-news-ingest
        run: npm test

      - name: Deploy production news ingest worker
        id: deploy
        working-directory: workers/ufc-news-ingest
        run: |
          set -euo pipefail
          npx --yes wrangler@4.131.1 deploy 2>&1 | tee deploy.log
          WORKER_URL="$(grep -Eo 'https://[^[:space:]]+workers\.dev' deploy.log | tail -1 || true)"
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL="https://ufc-news-ingest.sales-fd3.workers.dev"
          fi
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Production health proof
        working-directory: workers/ufc-news-ingest
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          echo "Worker: $WORKER_URL"
          curl --fail --silent --show-error --retry 3 "$WORKER_URL/health" | tee health.json
          echo
          curl --fail --silent --show-error --retry 3 "$WORKER_URL/feeds/health" | tee feeds-health.json
          echo
          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          const feeds = JSON.parse(fs.readFileSync('feeds-health.json', 'utf8'));
          console.log('health summary:', JSON.stringify({
            service: health.service,
            version: health.version,
            queue_producer_enabled: health.queue_producer_enabled,
            last_status: health.last_status,
            last_run_at: health.last_run_at,
            last_error: health.last_error,
            fighter_status: health.fighter_status,
          }, null, 2));
          const rows = feeds.feeds || feeds.sources || feeds.data || [];
          if (Array.isArray(rows)) {
            console.log('feed health:', JSON.stringify(rows.map((x) => ({
              source: x.source,
              circuit: x.circuit,
              cooling_down: x.cooling_down,
              failures: x.failures,
              consecutive_failures: x.consecutive_failures,
              not_modified: x.not_modified,
              last_success_at: x.last_success_at,
              last_failure_at: x.last_failure_at,
              last_failure_reason: x.last_failure_reason,
              has_etag: x.has_etag,
              has_last_modified: x.has_last_modified,
            })), null, 2));
          }
          NODE

      - name: Upload production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ufc-news-ingest-production-proof-${{ github.run_id }}
          path: |
            workers/ufc-news-ingest/deploy.log
            workers/ufc-news-ingest/health.json
            workers/ufc-news-ingest/feeds-health.json
          if-no-files-found: warn
