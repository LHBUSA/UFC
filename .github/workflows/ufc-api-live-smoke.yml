name: UFC API live smoke

on:
  push:
    branches:
      - ufc-api-v1
      - ufc-production-v3
    paths:
      - 'workers/ufc-api/**'
      - '.github/workflows/ufc-api-live-smoke.yml'
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: UFC API worker unit tests
        working-directory: workers/ufc-api
        run: npm install && npm test && npm run check

      - name: Combat Wikipedia worker unit tests and dry build
        working-directory: workers/combat-wikipedia-ingest
        run: npm install && npm test && npx wrangler deploy --dry-run --outdir /tmp/combat-wikipedia-dry-run

      - name: Live production API smoke
        working-directory: workers/ufc-api
        env:
          UFC_API_BASE_URL: https://ufc-api.propbetedge.ai
        run: node smoke_live.mjs
