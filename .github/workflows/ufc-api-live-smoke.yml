name: UFC API live smoke

on:
  push:
    branches:
      - ufc-api-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Worker unit tests
        working-directory: workers/ufc-api
        run: npm ci && npm test && npm run check

      - name: Live production API smoke
        working-directory: workers/ufc-api
        env:
          UFC_API_BASE_URL: https://ufc-api.propbetedge.ai
        run: node smoke_live.mjs
