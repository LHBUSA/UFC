name: UFC Pro sales refresh

on:
  push:
    paths:
      - scripts/ci/pro_sales_refresh.py
      - .github/workflows/pro-sales-refresh.yml

permissions:
  contents: write

concurrency:
  group: ufc-pro-sales-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Correct one-shot CSS token
        run: sed -i 's/--pbe-font-body/--pbe-font-data/g' scripts/ci/pro_sales_refresh.py

      - name: Rewrite UFC Pro sales surfaces
        run: python scripts/ci/pro_sales_refresh.py

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Paywall and algo tests
        working-directory: web
        run: |
          npm run test:paywall
          npm run test:algo
          npm run check:css-tokens

      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit

      - name: Production build
        working-directory: web
        run: npm run build

      - name: Commit verified sales refresh
        run: |
          git config user.name "PropBetEdge Build Bot"
          git config user.email "buildbot@propbetedge.ai"
          git add web/components/ui.tsx web/app/page.tsx web/app/pro/page.tsx web/app/pro-gate.css
          git diff --cached --check
          git commit -m "Make PBE Picks the UFC Pro flagship"
          git push origin HEAD:main
