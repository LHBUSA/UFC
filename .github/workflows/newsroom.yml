# ufc.propbetedge.ai — newsroom, rankings and portrait pipelines.
# Production automation runs directly from the default branch.
#
# Freshness contract:
#   * source ingest every 30 minutes year-round;
#   * third-party items remain source/live-wire material, not standalone publications;
#   * deterministic first-party article writer runs when new items land or on a two-hour baseline;
#   * the bettor-first feature layer runs every newsroom pass and builds/refreshes
#     card-level guides and post-event market resets from verified PropBetEdge fact blocks;
#   * every core writer pass is followed by the fail-closed premium editorial desk;
#   * Anthropic is preferred when configured; Copilot CLI is the automatic
#     Actions-native fallback using the short-lived GITHUB_TOKEN;
#   * a daily quality sweep catches any recent story that missed the editorial desk;
#   * both writer layers are fact-block-first and idempotent.
name: newsroom
on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "17 10 * * *"      # guaranteed daily world-class editorial sweep
    - cron: "41 11 * * 2,3"
    - cron: "5 9 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "news | editorial | rankings | portraits | all"
        default: "all"
      force_write:
        description: "run the article writer even if nothing new was ingested"
        default: "false"

permissions:
  contents: read
  copilot-requests: write

concurrency: newsroom
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GITHUB_TOKEN: ${{ github.token }}
  UFC_EDITORIAL_COPILOT_MODEL: auto
jobs:
  news:
    if: github.event.schedule == '*/30 * * * *' || github.event_name == 'workflow_dispatch' && (inputs.job == 'news' || inputs.job == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nANTHROPIC_API_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" "$ANTHROPIC_API_KEY" > .env
      - run: node scripts/news/seed_sources.mjs
      - name: Ingest sources (every run)
        id: ingest
        run: |
          set -o pipefail
          node scripts/news/ingest_news.mjs | tee ingest.log
          inserted=$(grep -oE 'inserted=[0-9]+' ingest.log | tail -1 | cut -d= -f2)
          echo "inserted=${inserted:-0}" >> "$GITHUB_OUTPUT"
      - name: Decide whether the writer runs
        id: gate
        run: |
          hour=$(date -u +%H); minute=$(date -u +%M)
          baseline=false; if [ $((10#$hour % 2)) -eq 0 ] && [ "$minute" -lt 30 ]; then baseline=true; fi
          if [ "${{ steps.ingest.outputs.inserted }}" != "0" ] || [ "$baseline" = "true" ] || [ "${{ inputs.force_write }}" = "true" ]; then echo "write=true" >> "$GITHUB_OUTPUT"; else echo "write=false" >> "$GITHUB_OUTPUT"; fi
          echo "inserted=${{ steps.ingest.outputs.inserted }} baseline=$baseline"
      - name: Write PropBetEdge-owned fact-block articles (gated)
        if: steps.gate.outputs.write == 'true'
        run: node scripts/news/write_articles.mjs --types preview,results,card_change ${{ env.ANTHROPIC_API_KEY != '' && '--llm' || '' }}
      - name: Write bettor-first newsroom features (every pass, idempotent)
        run: node scripts/news/write_features.mjs
      - name: Install Copilot CLI for editorial fallback
        if: steps.gate.outputs.write == 'true'
        run: npm install -g @github/copilot
      - name: World-class editorial desk (fail closed)
        if: steps.gate.outputs.write == 'true'
        run: node scripts/news/polish_world_class.mjs --recent-hours 720 --limit 30

  editorial:
    if: github.event.schedule == '17 10 * * *' || github.event_name == 'workflow_dispatch' && (inputs.job == 'editorial' || inputs.job == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nANTHROPIC_API_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" "$ANTHROPIC_API_KEY" > .env
      - name: Install Copilot CLI editorial fallback
        run: npm install -g @github/copilot
      - name: Verify editorial provider is available
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$GITHUB_TOKEN" ]; then
            echo "No editorial model provider is configured" >&2
            exit 1
          fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then echo "editorial provider: Anthropic (+ Copilot CLI fallback)"; else echo "editorial provider: Copilot CLI"; fi
      - name: Daily world-class editorial sweep (fail closed)
        run: node scripts/news/polish_world_class.mjs --recent-hours 1440 --limit 60

  rankings:
    if: github.event.schedule == '41 11 * * 2,3' || github.event_name == 'workflow_dispatch' && (inputs.job == 'rankings' || inputs.job == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" > .env
      - run: node scripts/rankings/ingest_rankings.mjs
  portraits:
    if: github.event.schedule == '5 9 * * *' || github.event_name == 'workflow_dispatch' && (inputs.job == 'portraits' || inputs.job == 'all')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --ignore-scripts=false
      - run: printf 'SUPABASE_URL=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_SERVICE_ROLE_KEY" > .env
      - uses: actions/cache@v4
        with:
          path: scripts/images/cache
          key: portraits-cache-${{ github.run_id }}
          restore-keys: portraits-cache-
      - run: node scripts/images/fetch_fighter_portraits.mjs
