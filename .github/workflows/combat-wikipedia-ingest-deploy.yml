name: Deploy combat Wikipedia ingest

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/combat-wikipedia-ingest-deploy.yml"
      - "workers/combat-wikipedia-ingest/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-combat-wikipedia-ingest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Deployment credential preflight
        id: preflight
        shell: bash
        run: |
          ready=true
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured; Cloudflare deploy is intentionally skipped."
            ready=false
          fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not configured; Cloudflare deploy is intentionally skipped."
            ready=false
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Install Worker dependencies
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        working-directory: workers/combat-wikipedia-ingest
        run: npm install

      - name: Worker tests and dry build
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        working-directory: workers/combat-wikipedia-ingest
        run: npm test && npx wrangler deploy --dry-run --outdir /tmp/combat-wikipedia-dry-run

      - name: Deploy inert Cloudflare Worker
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        id: deploy
        working-directory: workers/combat-wikipedia-ingest
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/combat-wikipedia-deploy.log
          worker_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/combat-wikipedia-deploy.log | tail -1 || true)
          if [ -z "$worker_url" ]; then
            worker_url="https://combat-wikipedia-ingest.sales-fd3.workers.dev"
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"
          echo "Deployed Worker endpoint: $worker_url"

      - name: Configure production secrets
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        id: secrets
        working-directory: workers/combat-wikipedia-ingest
        shell: bash
        run: |
          set -euo pipefail
          admin_token=$(openssl rand -hex 32)
          echo "::add-mask::$admin_token"
          printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          printf '%s' "$admin_token" | npx wrangler secret put ADMIN_TRIGGER_TOKEN
          echo "admin_token=$admin_token" >> "$GITHUB_OUTPUT"

      - name: Verify Worker health
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "$WORKER_URL/health" -o /tmp/combat-health.json; then
              cat /tmp/combat-health.json
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Worker health endpoint did not become available" >&2
          exit 1

      - name: Run read-only production canary
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
          ADMIN_TRIGGER_TOKEN: ${{ steps.secrets.outputs.admin_token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ADMIN_TRIGGER_TOKEN" \
            "$WORKER_URL/admin/canary" \
            -o /tmp/combat-canary.json

          node <<'NODE'
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('/tmp/combat-canary.json', 'utf8'));
          if (r.error) throw new Error(r.error);
          if (r.mode !== 'canary') throw new Error(`unexpected canary mode ${r.mode}`);
          if (r.write_requested !== false || r.writes !== null) {
            throw new Error('read-only canary attempted a write');
          }
          if (!Array.isArray(r.fighters) || r.fighters.length < 2) {
            throw new Error('canary returned too few fighter probes');
          }
          const safe = {
            worker: r.worker,
            mode: r.mode,
            wikipedia_requests: r.wikipedia_requests,
            totals: r.totals,
            fighters: r.fighters.map((f) => ({
              name: f.name,
              status: f.status,
              wikipedia_title: f.wikipedia_title || null,
              wikipedia_career_rows: f.wikipedia_career_rows ?? null,
              candidate_external_rows: f.candidate_external_rows ?? null,
              promotable_external_rows: f.promotable_external_rows ?? null,
              identity: f.identity ? {
                verified: f.identity.verified,
                canonical_ufc_appearances: f.identity.canonical_ufc_appearances,
                wikipedia_ufc_rows: f.identity.wikipedia_ufc_rows,
                exact_ufc_matches: f.identity.exact_ufc_matches,
                dob_match: f.identity.dob_match,
                dob_conflict: f.identity.dob_conflict,
                ufc_conflicts: f.identity.ufc_conflicts,
              } : null,
            })),
          };
          console.log(JSON.stringify(safe, null, 2));
          NODE

      - name: Confirm runtime remains staged off
        if: ${{ steps.preflight.outputs.ready == 'true' }}
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$WORKER_URL/health" -o /tmp/combat-health-final.json
          node <<'NODE'
          const fs = require('node:fs');
          const h = JSON.parse(fs.readFileSync('/tmp/combat-health-final.json', 'utf8'));
          if (h.schedule_enabled !== false) throw new Error('SCHEDULE_ENABLED unexpectedly true');
          if (h.write_enabled !== false) throw new Error('WRITE_ENABLED unexpectedly true');
          console.log('Cloudflare runtime is deployed and inert: schedule=false, writes=false.');
          NODE
